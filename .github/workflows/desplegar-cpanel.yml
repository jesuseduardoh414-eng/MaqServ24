# Despliega en cPanel SIN pasar por el Administrador de archivos.
#
# Antes: Run workflow → bajar cpanel.zip → subir tres .tar.gz → extraer cada uno
# en su carpeta → RESTART app por app. Cada despliegue eran ~15 minutos de
# clics y dos trampas conocidas (extraer en la carpeta equivocada, olvidar el
# RESTART). Ahora todo eso lo hace este workflow por SSH.
#
# SE DISPARA:
#   - solo con cada push a `main` (automático), y
#   - a mano desde Actions → "Desplegar en cPanel" → Run workflow.
#
# ORDEN Y FRENO: api → web → admin, UNA a la vez, y después de reiniciar cada
# una espera a que responda antes de seguir. Si una no levanta, se detiene ahí:
# en esta cuenta un reinicio puede fallar por falta de procesos (NPROC), y
# tumbar las tres a la vez sería quedarse sin sitio. La API va primero porque
# las otras dos dependen de ella.
#
# CÓMO REINICIA: `touch tmp/restart.txt` en la carpeta de la app. Es la señal
# que Passenger/LiteSpeed reconocen (comprobado en este servidor el 21-sep).
# Las variables de entorno de cPanel no se tocan: sobreviven al despliegue.
#
# QUÉ NECESITA (una sola vez, ver DEPLOY-CPANEL.md):
#   Secret  CPANEL_SSH_KEY   llave privada (su pública, autorizada en cPanel → SSH Access)
#   Var     CPANEL_HOST      s882.use1.mysecurecloudhost.com
#   Var     CPANEL_USER      maqserv24
#   Var     CPANEL_PORT      22 (o el que diga cPanel → SSH Access)
#   Vars    API_URL, SITE_URL, ADMIN_URL   para comprobar que cada app responde
name: Desplegar en cPanel

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Qué desplegar (web admin api)'
        default: 'web admin api'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

# Dos despliegues a la vez pisándose los archivos sería lo peor que puede pasar.
concurrency:
  group: despliegue-cpanel
  cancel-in-progress: false

jobs:
  # Primero lo barato: si faltan la llave o el host, que falle en 5 segundos
  # y no después de compilar tres apps durante dos minutos.
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar configuración
        env:
          LLAVE: ${{ secrets.CPANEL_SSH_KEY }}
          HOST: ${{ vars.CPANEL_HOST }}
          USUARIO: ${{ vars.CPANEL_USER }}
        run: |
          faltan=""
          [ -n "$LLAVE" ]   || faltan="$faltan CPANEL_SSH_KEY(secret)"
          [ -n "$HOST" ]    || faltan="$faltan CPANEL_HOST(var)"
          [ -n "$USUARIO" ] || faltan="$faltan CPANEL_USER(var)"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan en GitHub → Settings → Secrets and variables → Actions:$faltan. Ver DEPLOY-CPANEL.md, sección 'Despliegue automático'."
            exit 1
          fi
          echo "Configuración completa."

  empaquetar:
    needs: comprobar
    uses: ./.github/workflows/empaquetar-cpanel.yml
    with:
      apps: ${{ inputs.apps || 'web admin api' }}
    secrets: inherit

  desplegar:
    needs: empaquetar
    runs-on: ubuntu-latest
    env:
      APPS: ${{ inputs.apps || 'web admin api' }}
      HOST: ${{ vars.CPANEL_HOST }}
      USUARIO: ${{ vars.CPANEL_USER }}
      PUERTO: ${{ vars.CPANEL_PORT || 22 }}
      # Variables PROPIAS del despliegue (DEPLOY_*), no las API_URL/SITE_URL del
      # repo: ésas las usa la compilación y pueden apuntar a otra cosa (venían
      # de la época de Render). Sin ellas, los dominios de producción.
      # Desde el cambio de dominio (oct-2026) las apps viven en maqser24.com; el
      # anterior solo redirige, y una comprobación contra él recibiría un 301.
      API_URL: ${{ vars.DEPLOY_API_URL || 'https://api.maqser24.com' }}
      SITE_URL: ${{ vars.DEPLOY_SITE_URL || 'https://maqser24.com' }}
      ADMIN_URL: ${{ vars.DEPLOY_ADMIN_URL || 'https://admin.maqser24.com' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cpanel
          path: paquetes

      - name: Llave SSH
        env:
          LLAVE: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Se normaliza lo pegado: fuera los \r de Windows y los espacios de
          # sobra al final de cada línea, y con salto final. El 21-sep una llave
          # pegada desde el Bloc de notas llegó con \r\n y OpenSSH la rechazó con
          # "error in libcrypto", que no dice nada a nadie.
          printf '%s\n' "$LLAVE" | tr -d '\r' | sed -e 's/[[:space:]]*$//' > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          if ! ssh-keygen -y -f ~/.ssh/despliegue > /tmp/publica 2>/dev/null; then
            echo "::error::La llave privada del secret CPANEL_SSH_KEY no se puede leer. Tiene que ser el archivo COMPLETO, desde '-----BEGIN OPENSSH PRIVATE KEY-----' hasta '-----END OPENSSH PRIVATE KEY-----', sin nada más. La forma segura de copiarlo en Windows: PowerShell → Get-Content -Raw ruta\\deploy_key | Set-Clipboard"
            exit 1
          fi
          echo "Llave leída. Huella: $(ssh-keygen -lf /tmp/publica | awk '{print $2}') — debe coincidir con la autorizada en cPanel → SSH Access."
          # Primera conexión: se acepta la huella del servidor tal cual (TOFU).
          ssh-keyscan -p "$PUERTO" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Subir, extraer y reiniciar (una app a la vez)
        run: |
          set -euo pipefail
          SSH="ssh -p $PUERTO -i ~/.ssh/despliegue -o BatchMode=yes $USUARIO@$HOST"
          SCP="scp -P $PUERTO -i ~/.ssh/despliegue -o BatchMode=yes"

          # api primero: web y admin dependen de ella.
          for app in api web admin; do
            case " $APPS " in *" $app "*) ;; *) continue ;; esac
            [ -f "paquetes/$app.tar.gz" ] || { echo "::error::No hay paquete de $app"; exit 1; }

            echo "▶ $app: subiendo $(du -h "paquetes/$app.tar.gz" | cut -f1)"
            $SCP "paquetes/$app.tar.gz" "$USUARIO@$HOST:nodeapps/$app/.paquete.tar.gz"

            echo "▶ $app: extrayendo en nodeapps/$app y pidiendo reinicio"
            $SSH "cd nodeapps/$app && tar -xzf .paquete.tar.gz && rm -f .paquete.tar.gz && mkdir -p tmp && touch tmp/restart.txt"

            # Despertar y esperar. La app arranca con la primera petición y
            # tarda 5-10 s en frío; se le dan hasta 2,5 minutos.
            #
            # La comprobación se hace DESDE EL SERVIDOR (por SSH), no desde el
            # runner: la primera corrida real (21-sep) desplegó bien la API y
            # aun así falló, porque el runner de GitHub no alcanzaba la API por
            # HTTPS (curl → 000, sin conexión). El servidor sí se alcanza a sí
            # mismo, y el SSH ya demostró que llega.
            case $app in
              api)   url="$API_URL/health";  espera='"db":"ok"' ;;
              web)   url="$SITE_URL/";       espera='' ;;
              admin) url="$ADMIN_URL/login"; espera='' ;;
            esac
            ok=""; codigo=""
            for i in $(seq 1 30); do
              cuerpo=$($SSH "curl -s --max-time 60 -w '\n%{http_code}' '$url'" || true)
              codigo=$(printf '%s' "$cuerpo" | tail -n1)
              if [ "$codigo" = "200" ] && { [ -z "$espera" ] || printf '%s' "$cuerpo" | grep -q "$espera"; }; then
                ok=1; break
              fi
              echo "   … $app aún no responde ($url → ${codigo:-sin respuesta}), intento $i/30"
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "::error::$app no respondió bien tras el reinicio ($url → ${codigo:-sin respuesta}). Me detengo para no tumbar las demás. Revisa Setup Node.js App; si sale 'Unable to fork', suspende/reactiva la cuenta desde WHM."
              exit 1
            fi
            echo "✅ $app responde ($url)"
          done
          echo "Despliegue completo: $APPS"

      # RENDIMIENTO (2026-10-29). Los archivos de `_next/static` (JS y CSS, unos 20
      # por página) los entregaba Node, uno detrás de otro: medido en producción,
      # 16 pedidos a la vez tardaban 1-2,5 s cada uno contra 0,5 s servidos por
      # LiteSpeed, y con carga hasta 17 s. Se copian a la raíz del documento del
      # dominio (la carpeta cuyo .htaccess de cPanel apunta a la app), donde
      # LiteSpeed los encuentra y los entrega sin despertar a Node; lo que no
      # esté ahí sigue llegando a Node como siempre. Los de compilaciones
      # anteriores se quedan 30 días (pestañas abiertas con la página vieja).
      #
      # Se comprueba con un archivo real: si no abre, no coincide o no lo
      # entrega LiteSpeed, se quita la copia y solo se avisa. Nunca tumba el
      # despliegue: en el peor caso todo sigue como antes.
      - name: Archivos de Next servidos por LiteSpeed (web y admin)
        run: |
          set -uo pipefail
          SSH="ssh -p $PUERTO -i ~/.ssh/despliegue -o BatchMode=yes $USUARIO@$HOST"
          for app in web admin; do
            case " $APPS " in *" $app "*) ;; *) continue ;; esac
            case $app in web) base="$SITE_URL" ;; admin) base="$ADMIN_URL" ;; esac
            salida=$($SSH "bash -s -- $app" <<'REMOTO' || true
          set -uo pipefail
          app="$1"
          origen=""
          for o in "$HOME/nodeapps/$app/apps/$app/.next/static" "$HOME/nodeapps/$app/.next/static"; do
            [ -d "$o" ] && { origen="$o"; break; }
          done
          [ -n "$origen" ] || { echo "ERROR=no encontré .next/static de $app"; exit 0; }
          raiz=""
          for h in $(find "$HOME" -maxdepth 3 -name .htaccess -not -path "$HOME/nodeapps/*" -not -path "$HOME/media/*" 2>/dev/null); do
            if grep -qE "^[[:space:]]*PassengerAppRoot[[:space:]]+\"?$HOME/nodeapps/$app/?\"?[[:space:]]*$" "$h"; then raiz=$(dirname "$h"); break; fi
          done
          [ -n "$raiz" ] || { echo "ERROR=no encontré la raíz del documento que apunta a nodeapps/$app"; exit 0; }
          destino="$raiz/_next/static"
          mkdir -p "$destino"
          cp -a "$origen/." "$destino/"
          find "$destino" -type f -mtime +30 ! -name .htaccess -delete 2>/dev/null
          find "$destino" -mindepth 1 -type d -empty -delete 2>/dev/null
          cat > "$destino/.htaccess" <<'HTACCESS'
          # Lo escribe el despliegue (.github/workflows/desplegar-cpanel.yml). No lo edites aquí.
          # Archivos con huella en el nombre: no cambian nunca, se guardan un año.
          Options -Indexes
          <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
            Header set X-Content-Type-Options "nosniff"
          </IfModule>
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE application/javascript text/javascript text/css
          </IfModule>
          HTACCESS
          prueba=$(cd "$origen" && find chunks -maxdepth 1 -name '*.js' -size +2k 2>/dev/null | head -n1)
          echo "RAIZ=$raiz"
          echo "PRUEBA=$prueba"
          [ -n "$prueba" ] && echo "HUELLA=$(sha256sum "$destino/$prueba" | cut -d' ' -f1)"
          REMOTO
            )
            error=$(printf '%s\n' "$salida" | sed -n 's/^ERROR=//p')
            raiz=$(printf '%s\n' "$salida" | sed -n 's/^RAIZ=//p')
            prueba=$(printf '%s\n' "$salida" | sed -n 's/^PRUEBA=//p')
            huella=$(printf '%s\n' "$salida" | sed -n 's/^HUELLA=//p')
            if [ -n "$error" ] || [ -z "$raiz" ]; then
              echo "::warning::$app: no se copiaron los archivos de Next a la raíz del dominio (${error:-sin respuesta}). Siguen saliendo de Node, como antes."
              continue
            fi
            echo "▶ $app: archivos de Next copiados en $raiz/_next/static"
            [ -n "$prueba" ] || { echo "::warning::$app: no hay un archivo de prueba; se deja la copia sin comprobar."; continue; }
            url="$base/_next/static/$prueba"
            cabeceras=$($SSH "curl -sI --max-time 30 -H 'Accept-Encoding: gzip, br' '$url'" || true)
            recibida=$($SSH "curl -s --compressed --max-time 30 '$url' | sha256sum | cut -d' ' -f1" || true)
            if ! printf '%s' "$cabeceras" | head -n1 | grep -q ' 200' || [ "$recibida" != "$huella" ]; then
              echo "::warning::$app: $url no respondió bien desde la copia; se quita y siguen saliendo de Node."
              printf '%s\n' "$cabeceras" | head -n8
              $SSH "rm -rf '$raiz/_next'"
              continue
            fi
            # `Permissions-Policy` solo la pone Next (next.config → headers), no LiteSpeed.
            if printf '%s' "$cabeceras" | grep -qi '^permissions-policy:'; then
              echo "::warning::$app: LiteSpeed no tomó la copia (el archivo sigue saliendo de Node); se quita."
              $SSH "rm -rf '$raiz/_next'"
              continue
            fi
            compresion=$(printf '%s' "$cabeceras" | sed -n 's/^[Cc]ontent-[Ee]ncoding: *//p' | tr -d '\r')
            [ -n "$compresion" ] || echo "::warning::$app: LiteSpeed entrega los archivos SIN comprimir. Funciona, pero pesan más: revisar la compresión en el hosting."
            echo "✅ $app: los archivos de Next salen de LiteSpeed (${compresion:-sin comprimir})"
          done

      # media.maqser24.com sirve la carpeta ~/media tal cual (fotos, videos, papeles
      # de aliados). Su .htaccess se ponía a mano y no tenía `nosniff`: un archivo
      # viejo con contenido de página se abría como página en un subdominio nuestro
      # (auditoría 2026-10-23). Aquí se escribe solo en cada despliegue: nada que no
      # sea imagen/video/PDF se abre en línea, nada se ejecuta, y si después de
      # escribirlo una imagen deja de abrir, se regresa el anterior y solo se avisa.
      - name: Proteger la carpeta de archivos (media)
        env:
          MEDIA_URL: ${{ vars.DEPLOY_MEDIA_URL || 'https://media.maqser24.com' }}
        run: |
          set -uo pipefail
          SSH="ssh -p $PUERTO -i ~/.ssh/despliegue -o BatchMode=yes $USUARIO@$HOST"
          $SSH "test -d media" || { echo "::warning::No existe ~/media en el servidor; no se toca nada."; exit 0; }
          $SSH "cat > media/.htaccess.nuevo" <<'HTACCESS'
          # Lo escribe el despliegue (.github/workflows/desplegar-cpanel.yml) en cada subida.
          # No lo edites aquí: cámbialo en el workflow.
          Options -Indexes
          <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=604800"
            Header set X-Content-Type-Options "nosniff"
            <FilesMatch "\.(?i:svgz?|html?|xhtml|xml|xsl|js|mjs|json|txt|css)$">
              Header set Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox"
              Header set Content-Disposition "attachment"
            </FilesMatch>
          </IfModule>
          <FilesMatch "\.(?i:php[0-9]?|phtml|phar|pl|py|cgi|sh|asp|aspx|jsp)$">
            Require all denied
          </FilesMatch>
          HTACCESS
          # Respaldo del que había (una vez por despliegue) y cambio.
          $SSH "cd media && { [ -f .htaccess ] && cp -p .htaccess .htaccess.antes || true; } && mv .htaccess.nuevo .htaccess"
          # Comprobación con un archivo real.
          prueba=$($SSH "ls media/uploads 2>/dev/null | grep -iE '\.(png|jpe?g|webp)$' | head -n1" || true)
          if [ -z "$prueba" ]; then echo "::warning::No hay imágenes en media/uploads para comprobar; se deja el .htaccess nuevo."; exit 0; fi
          cabeceras=$($SSH "curl -sI --max-time 30 '$MEDIA_URL/uploads/$prueba'" || true)
          if printf '%s' "$cabeceras" | head -n1 | grep -q ' 200' && printf '%s' "$cabeceras" | grep -qi 'x-content-type-options: *nosniff'; then
            echo "✅ media protegida ($prueba abre y lleva nosniff)"
          else
            echo "::warning::Con el .htaccess nuevo, $MEDIA_URL/uploads/$prueba no respondió como se esperaba; se regresa el anterior."
            printf '%s\n' "$cabeceras" | head -n5
            $SSH "cd media && { [ -f .htaccess.antes ] && mv .htaccess.antes .htaccess || rm -f .htaccess; }"
          fi
