# Render Blueprint para la API NestJS (@maqserv/api).
# La API es STATELESS: datos en Supabase Postgres, imágenes en Supabase Storage.
# Por eso NO necesita disco persistente.
#
# Uso: en Render → New → Blueprint → conecta el repo servmaq24.
# Render lee este archivo, crea el servicio y te pide las variables marcadas `sync: false`.
services:
  - type: web
    name: servmaq-api
    runtime: node
    # REGIÓN: ponla cerca de la BD, no de los usuarios.
    #   Una visita hace 1 salto usuario→API, pero la API hace DECENAS de saltos API→BD
    #   para armar la página. Manda la distancia a Supabase.
    #   La BD está en `ca-central-1` (Montreal) ⇒ `ohio` o `virginia` (~20-30 ms).
    #   `oregon` cruza el continente en CADA consulta (~70 ms) y era el valor anterior.
    #   (Comprueba la región real de tu proyecto en el host del DATABASE_URL.)
    region: ohio
    # OJO: el plan `free` DUERME tras ~15 min sin tráfico y la primera visita después
    # tarda 30-60 s en despertarlo. Si el sitio "a veces tarda muchísimo y luego va bien",
    # es esto. Para producción: `starter`.
    plan: free
    rootDir: .              # el repo raíz ES servmaq-platform (aquí vive el .git)
    # No usar `corepack enable` en Render: /usr/bin es read-only (EROFS). Render ya
    # provee pnpm al detectar pnpm-lock.yaml + el campo packageManager del package.json.
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@maqserv/api
    startCommand: pnpm --filter @maqserv/api start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # --- Base de datos (Supabase Postgres). Copia los valores desde packages/db/.env ---
      # DATABASE_URL va al pooler en modo SESIÓN (:5432), NO al de transacción (:6543).
      # Esta API es un proceso persistente, no serverless: con :6543 + ?pgbouncer=true
      # Prisma gasta 4 viajes de red por consulta en vez de 1 (medido: 4x más lento).
      # Ver la explicación larga en apps/api/.env.example.
      - key: DATABASE_URL         # pooler SESSION :5432 + ?connection_limit=10&pool_timeout=20
        sync: false
      - key: DIRECT_URL           # pooler session :5432 (migraciones)
        sync: false
      # --- Supabase (Auth + Storage) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY # service_role — SECRETO, no lo compartas
        sync: false
      - key: IMAGE_BASE_URL       # https://<proyecto>.supabase.co/storage/v1/object/public/media
        sync: false
      # --- URLs públicas ---
      - key: SITE_URL             # dominio de la tienda en Vercel (back_urls de pago, revalidación)
        sync: false
      - key: API_PUBLIC_URL       # esta misma URL de Render (webhook de MercadoPago)
        sync: false
      - key: CORS_ORIGINS         # dominios web y admin de Vercel, separados por coma
        sync: false
      # --- Pagos ---
      - key: MP_ACCESS_TOKEN      # access token de MercadoPago
        sync: false
      - key: MP_WEBHOOK_SECRET    # secreto del webhook de MP (valida x-signature); opcional
        sync: false
      # --- Revalidación on-demand del sitio Next (mismo valor que en la web) ---
      - key: REVALIDATE_SECRET
        sync: false
      # --- Rate limit por visitante: firma de x-client-ip (MISMO valor en web y admin de Vercel).
      # Sin él, el límite cuenta por header falsificable (la API avisa con warn pero acepta). ---
      - key: PROXY_SECRET
        sync: false
      # --- Portal de aliados: firma de enlaces. OBLIGATORIO si se usa el módulo de aliados;
      # sin él, portal aliado / matching / recordatorios lanzan 500. ---
      - key: PROVIDER_LINK_SECRET
        sync: false
      # --- Tareas programadas (/tareas/recordatorios y /tareas/ordenes-vencidas).
      # Sin secreto las rutas no existen. Lo usa el cron externo (cabecera x-tasks-secret). ---
      - key: TASKS_SECRET
        sync: false
      # --- Correo saliente (recordatorios). Sin esto, modo simulado (no envía nada). ---
      - key: MAIL_ENABLED         # "true" para envío real
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      # --- Opcionales (déjalas sin valor si no las usas) ---
      - key: PERFEX_URL
        sync: false
      - key: PERFEX_TOKEN
        sync: false
      - key: GOOGLE_DISTANCE_MATRIX_API_KEY
        sync: false
